<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>File Upload | WebServ</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<nav>
			<ul>
				<li><a href="dashboard.html"><h1>Dashboard</h1></a></li>
				<li><a href="gallery.html"><h1>Gallery</h1></a></li>
				<li><a href="cgiDemo.html"><h1>CGI Demo</h1></a></li>
				<li><a href="fileUpload.html" class="active"><h1>File Upload</h1></a></li>
			</ul>
		</nav>
	</header>
	<main class="dashboard">
		<div class="card">
			<h1>Upload Files</h1>
			<p class="text-muted mt-1">Upload files to the server using HTTP POST</p>
			<form id="upload-form" action="/www" method="POST" enctype="multipart/form-data" class="mt-3">
				<div>
					<label for="file">Select File</label>
					<input type="file" id="file" name="file" required>
				</div>
				<button type="submit">Upload File</button>
			</form>
		</div>
		<div class="card">
			<h1>Uploaded Files</h1>
			<p class="text-muted mt-1" id="uploads-status">Loading uploads...</p>
			<ul id="uploads-list" class="file-list"></ul>
		</div>
	</main>
	<script>
		function fileNameFromHref(href) {
			const parts = href.split("/");
			return decodeURIComponent(parts[parts.length - 1] || "uploaded file");
		}

		function renderUploadItem(href) {
			const item = document.createElement("li");
			const link = document.createElement("a");
			link.href = href;
			link.textContent = fileNameFromHref(href);
			item.appendChild(link);
			return item;
		}

		async function loadUploads() {
			const status = document.getElementById("uploads-status");
			const list = document.getElementById("uploads-list");

			try {
				const response = await fetch("/www", { cache: "no-store" });
				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`);
				}

				const htmlText = await response.text();
				const doc = new DOMParser().parseFromString(htmlText, "text/html");
				const links = Array.from(doc.querySelectorAll('a[href^="/www/"]'));
				const hrefs = [...new Set(links.map((link) => link.getAttribute("href") || "").filter(Boolean))];

				list.innerHTML = "";
				if (hrefs.length === 0) {
					status.textContent = "No uploads yet.";
					return;
				}

				status.textContent = `${hrefs.length} upload${hrefs.length > 1 ? "s" : ""} found.`;
				hrefs.forEach((href) => list.appendChild(renderUploadItem(href)));
			} catch (error) {
				status.textContent = `Failed to load uploads: ${error.message}`;
			}
		}

		async function submitUpload(event) {
			event.preventDefault();

			const form = event.currentTarget;
			const formData = new FormData(form);

			try {
				const response = await fetch(form.action, {
					method: "POST",
					body: formData
				});

				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`);
				}

				alert("Upload successful!");
				form.reset();
				await loadUploads();
			} catch (error) {
				alert(`Upload failed: ${error.message}`);
			}
		}

		document.getElementById("upload-form").addEventListener("submit", submitUpload);
		loadUploads();
	</script>
</body>
</html>
