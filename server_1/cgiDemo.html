<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CGI Demo | WebServ</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<nav>
			<ul>
				<li><a href="dashboard.html"><h1>Dashboard</h1></a></li>
				<li><a href="gallery.html"><h1>Gallery</h1></a></li>
				<li><a href="cgiDemo.html" class="active"><h1>CGI Demo</h1></a></li>
				<li><a href="fileUpload.html"><h1>File Upload</h1></a></li>
			</ul>
		</nav>
	</header>
	<main class="dashboard">
		<div class="card">
			<h1>CGI Form Submission</h1>
			<p class="text-muted mt-1">Submit data to a Python CGI script</p>
			<form action="/cgi-bin/process.py" method="post" class="mt-3">
				<div>
					<label for="name">Your Name</label>
					<input type="text" id="name" name="name" placeholder="Enter your name" required>
				</div>
				<div>
					<label for="email">Email Address</label>
					<input type="email" id="email" name="email" placeholder="you@example.com" required>
				</div>
				<div>
					<label for="message">Message</label>
					<textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
				</div>
				<button type="submit">Submit Form</button>
			</form>
		</div>
		<div class="card">
			<h1>Script Execution</h1>
			<p class="text-muted mt-1">Execute server-side scripts directly</p>
			<div class="action-group mt-3">
				<a href="/cgi-bin/time.py" class="btn">Python Time</a>
				<a href="/cgi-bin/time.php" class="btn btn-secondary">PHP Time</a>
				<a href="/cgi-bin/infinite.py" class="btn btn-danger">Infinite Loop Test</a>
			</div>
		</div>
	</main>
</body>
</html>
